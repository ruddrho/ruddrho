name: Update robotics profile art

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install profile-art dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch public contribution data
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#1a1b27,#0e4429,#006d32,#26a641,#39d353

      - name: Commit refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-heatmap.svg assets/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
