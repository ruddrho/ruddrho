<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution heatmap awaiting first refresh</title>
  <desc id="desc">The daily workflow will replace this starter image with Ruddrho Mollik's public contribution data.</desc>
  <style>
    text { font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; }
    .cell { opacity: 1; animation: reveal .45s ease-out both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: .25; } }
    .status { animation: blink 1.6s ease-in-out infinite; }
  </style>
  <rect x="1" y="1" width="998" height="248" rx="14" fill="#16161e" stroke="#292e42" stroke-width="2"/>
  <text x="35" y="42" fill="#9ece6a" font-size="17">$ ./contributions.sh --daily</text>
  <text x="35" y="68" fill="#565f89" font-size="13">The first GitHub Actions run will load the live 53-week calendar.</text>
  <g transform="translate(90 92)">
    <rect class="cell" style="animation-delay:.05s" x="0" y="0" width="18" height="18" rx="4" fill="#1a1b27"/>
